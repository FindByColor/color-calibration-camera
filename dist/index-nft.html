<html>
<head>
    <!-- import aframe and then ar.js with image tracking / location based features -->
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.4.2/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <!-- style for the loader -->
    <style>
    .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
    }
    </style>
</head>
<body style="margin : 0px; overflow: hidden;">
  <!-- minimal loader shown until image descriptors are loaded. Loading may take a while according to the device computational power -->
  <div class="arjs-loader">
    <div>Loading, please wait...</div>
  </div>

  <!-- a-frame scene -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >

    <!-- Static Asset Sprites -->
    <a-assets>
      <img id="card-detector" src="assets/img/card-detector.png" alt="Find By Color - Card Detector">
      <img id="select-color" src="assets/img/select-color.png" alt="Find By Color - Select Color Region">
    </a-assets>
    <!-- a-nft is the anchor that defines an Image Tracking entity -->
    <!-- on 'url' use the path to the Image Descriptors created before. -->
    <!-- the path should end with the name without the extension e.g. if file is 'pinball.fset' the path should end with 'pinball' -->
    <!--       smooth='true' smoothCount='10' smoothTolerance='0.01' smoothThreshold='5' -->
    <a-nft nft_status
      type="nft"
      url="./assets/ar/fbc-card"
      smooth="true"
      smoothCount="100"
      smoothTolerance=".005"
      smoothThreshold="10"
    >
      <!-- Outline of Card -->
      <a-image
        id="cardDetector"
        src="#card-detector"
        width="1"
        height="1.58391338"
        geometry="height: 2470; width: 1570"
        position="500 0 -350"
        scale="0.5 0.5 0.5"
        rotation="-90 0 0"
        material="blending: normal; transparent: true; alphaTest:0;"
        visible="false"
        animation__togglevisible="property: visible; from: false; to: true; dur: 10; startEvents: fadeIn"
        animation__togglevisibleoff="property: visible; from: true; to: false; dur: 10; startEvents: fadeOut"
      ></a-image>

      <!-- User Color Selection Region -->
      <a-image
        id="useColor"
        src="#select-color"
        width="1"
        height="1.76388889"
        geometry="height: 720; width: 1570"
        position="500 0 -1150"
        scale="0.5 0.5 0.5"
        rotation="-90 0 0"
        material="blending: normal; transparent: true; alphaTest:0;"
        visible="false"
        animation__togglevisible="property: visible; from: false; to: true; dur: 10; startEvents: fadeIn"
        animation__togglevisibleoff="property: visible; from: true; to: false; dur: 10; startEvents: fadeOut"
      ></a-image>

      <a-entity
        id="3d-model"
        gltf-model="./assets/ar/fbc-card.gltf"
        width="1" height="1.58391338" geometry="height: 2048; width: 1293"
        position="500 0 -350" scale="12500 12500 12500" rotation="-90 -90 90"
        visible="false"
        animation__togglevisible="property: visible; from: false; to: true; dur: 10; startEvents: fadeIn"
        animation__togglevisibleoff="property: visible; from: true; to: false; dur: 10; startEvents: fadeOut"
      ></a-entity>

    </a-nft>
    <!-- static camera that moves according to the device movements -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    var resetCamera = false;
    AFRAME.registerComponent('nft_status', {
      init() {
        // document.querySelector('a-scene').sceneEl.camera = new THREE.PerspectiveCamera();
        const camera = document.querySelector('[camera]');
        const card = document.querySelector('a-nft');
        const scene = document.querySelector('a-scene');

        // Listen for when Markers are Found
        this.el.sceneEl.addEventListener('markerFound', (data) => {
          let cameraPosition = camera.object3D.position;
          let markerPosition = card.object3D.position;
          let distance = cameraPosition.distanceTo(markerPosition)
          const model = document.getElementById('3d-model');
          const cardDetector = document.getElementById('cardDetector');
          const useColor = document.getElementById('useColor');

          window.requestAnimationFrame(() => {
              cameraPosition = camera.object3D.position;
              markerPosition = card.object3D.position;
              distance = cameraPosition.distanceTo(markerPosition)

              // do what you want with the distance:
              // console.log('distance', distance);
              // console.log('markerPosition', markerPosition);

              if (cardDetector.object3D.visible && distance < 2000) {
                console.log('Move Back');
                // cardDetector.object3D.visible = false;
                // useColor.object3D.visible = false;
                cardDetector.emit('fadeOut', null, false);
                useColor.emit('fadeOut', null, false);

                if (model) {
                  // model.object3D.visible = false;
                  model.emit('fadeOut', null, false);
                }
              } if (cardDetector.object3D.visible && distance > 3000) {
                console.log('Move Up');
                // cardDetector.object3D.visible = false;
                // useColor.object3D.visible = false;
                cardDetector.emit('fadeOut', null, false);
                useColor.emit('fadeOut', null, false);

                if (model) {
                  // model.object3D.visible = false;
                  model.emit('fadeOut', null, false);
                }
              } else if (!cardDetector.object3D.visible) {
                // cardDetector.object3D.visible = true;
                // useColor.object3D.visible = true;
                cardDetector.emit('fadeIn', null, false);
                useColor.emit('fadeIn', null, false);

                if (model) {
                  // model.object3D.visible = true;
                  model.emit('fadeIn', null, false);
                }
              }
          });

          console.log('markerFound', data);

          if (!resetCamera) {
            scene.sceneEl.camera = new THREE.PerspectiveCamera();
            scene.sceneEl.camera.near = 1500;
            scene.sceneEl.camera.far = 100000;
          }
        })

        // Listen for when Markers are Lost
        this.el.sceneEl.addEventListener('markerLost', (data) => {
          clearInterval(window.checkPosition);
          console.log('markerLost', data);
          card.object3D.visible = false;
        })
      }
    })
    </script>
</body>
</html>
