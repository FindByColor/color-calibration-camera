<!DOCTYPE html>
<html dir="ltr" lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <title>Find By Color - Camera</title>

    <!-- Mobile Specific Meta Tags -->
    <meta name="viewport" content="initial-scale=1, viewport-fit=cover, width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FBC Camera">
    <meta name="application-name" content="FBC Camera">
    <meta name="theme-color" content="#0c1832">

    <script>const FBC_CAMERA_ENV = '{{ENV}}';</script>

    <!-- Image Capture Polyfill for Unsupported Browsers -->
    <script src="/assets/js/image-capture.polyfill.1.0.0.min.js?ac1690610216039"></script>

    <!-- Base AR Scripts -->
    <script src="/assets/js/aframe.1.0.0.min.js?ac1690610216039"></script>
    <script src="/assets/js/aframe-ar.1.0.0.min.js?ac1690610216039"></script>
    <script src="/assets/js/app.1.0.0.min.js?ac1690610216039"></script>

    <!-- Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/assets/css/app.1.0.0.min.css?ac1690610216039">
  </head>

  <body>
    <!-- Debug Overlay -->
    <div id="overlay">
      <ul id="logger"></ul>
    </div>

    <!-- Custom Buttons -->
    <button id="takePicture" disabled="true">Take Picture</button>
    <button id="toggleDebug">DEBUG</button>
    <img id="cardOutline" src="/assets/img/card-outline.png" alt="Find By Color - Card Outline">

    <!-- AR Scene to Render 3D assets -->
    <a-scene id="findByColor" embedded loading-screen="dotsColor: white; backgroundColor: #334155" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true;" arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; maxDetectionRate: 30; matrixCodeType: 3x3_HAMMING63; labelingMode: black_region;">
      <!-- Static Asset Sprites -->
      <a-assets>
        <img id="card-detector" src="/assets/img/card-detector.png" alt="Find By Color - Card Detector">
        <img id="select-color" src="/assets/img/select-color.png" alt="Find By Color - Select Color Region">
      </a-assets>

      <!-- Calibration Card Marker: Top Left -->
      <a-marker id="marker0" type="barcode" value="0" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5" track_marker>
        <!-- Outline of Card -->
        <a-image id="cardDetector" src="#card-detector" width="1" height="1" geometry="height: 11; width: 6.5" position="2 0 4.5" rotation="-90 0 0" material="blending: normal; transparent: true; alphaTest:0;" visible="false"></a-image>

        <!-- User Color Selection Region -->
        <a-image id="useColor" src="#select-color" width="1" height="1" geometry="height: 3; width: 6.5" position="2 0 -2.75" rotation="-90 0 0" material="blending: normal; transparent: true; alphaTest:0;" visible="false"></a-image>

        <a-box position='0 0.5 0' scale="1 0.1 1"  material='opacity: 0.5; side: double;color:red;'></a-box>
      </a-marker>

      <!-- Calibration Card Marker: Top Right -->
      <a-marker id="marker1" type="barcode" value="1" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5" track_marker>
        <a-box position='0 0.5 0' scale="1 0.1 1"  material='opacity: 0.5; side: double;color:green;'></a-box>
      </a-marker>

      <!-- Calibration Card Marker: Bottom Right -->
      <a-marker id="marker2" type="barcode" value="2" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5" track_marker>
        <a-box position='0 0.5 0' scale="1 0.1 1"  material='opacity: 0.5; side: double;color:blue;'></a-box>
      </a-marker>

      <!-- Calibration Card Marker: Bottom Left -->
      <a-marker id="marker3" type="barcode" value="3" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5" track_marker>
        <a-box position='0 0.5 0' scale="1 0.1 1"  material='opacity: 0.5; side: double;color:yellow;'></a-box>
      </a-marker>

      <!-- Users Camera -->
      <a-entity id="userCamera" camera="active: true" camera_status></a-entity>
    </a-scene>

    <div id="snapshotWrapper">
      <button id="closeSnapshot">×</button>
      <canvas id="snapshot"></canvas>
      <div class="snapshot-overlay"></div>
    </div>

    <!-- Scripts -->
    <script>
      // Check for Unsupported Browsers
      if (window.document.documentMode) {
        document.getElementById('unsupported-browser').style.display = 'block';
        document.getElementById('loading-wrapper').style.display = 'none';
        document.getElementById('page-wrapper').style.display = 'none';
        document.getElementById('back-to-top').style.display = 'none';
        // Redirect to Unsupported Browser Page
      } else if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>
  </body>
</html>
