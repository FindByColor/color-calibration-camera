<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">

    <title>Find By Color - Calibration</title>

    <!-- Image Capture Polyfill for Unsupported Browsers -->
    <script src="assets/js/image-capture.polyfill.js"></script>

    <!-- Base AR Scripts -->
    <script src="assets/js/aframe.min.js"></script>
    <script src="assets/js/aframe-ar.min.js"></script>
    <script src="assets/js/calibration-card.js"></script>

    <!-- Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>

  <body>
    <!-- Debug Overlay -->
    <div id="overlay">
      <ul id="logger"></ul>
    </div>

    <!-- Custom Buttons -->
    <button id="takePicture" disabled="true">Take Picture</button>
    <button id="toggleDebug">DEBUG</button>

    <!-- AR Scene to Render 3D assets -->
    <a-scene id="findByColor" embedded loading-screen="dotsColor: white; backgroundColor: #334155" vr-mode-ui="enabled: false" arjs="debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; maxDetectionRate: 30; matrixCodeType: 3x3_HAMMING63; labelingMode: white_region;">
      <!-- Static Asset Sprites -->
      <a-assets>
        <img id="card-outline" src="assets/img/card-outline.png">
        <img id="card-detector" src="assets/img/card-detector.png">
        <img id="select-color" src="assets/img/select-color.png">
      </a-assets>

      <!-- Calibration Card Marker: Top Left -->
      <a-marker id="marker0" type="barcode" value="0" smooth="true" smoothCount="100" track_marker>
        <!-- Outline of Card -->
        <a-image id="cardDetector" src="#card-detector" width="1" height="1" geometry="height: 11; width: 6.5" position="2 0 4.5" rotation="-90 0 0" material="blending: normal; transparent: true; alphaTest:0;" visible="false"></a-image>

        <!-- User Color Selection Region -->
        <a-image id="useColor" src="#select-color" width="1" height="1" geometry="height: 3; width: 6.5" position="2 0 -2.75" rotation="-90 0 0" material="blending: normal; transparent: true; alphaTest:0;" visible="false"></a-image>
      </a-marker>

      <!-- Calibration Card Marker: Top Right -->
      <a-marker id="marker1" type="barcode" value="1" smooth="true" smoothCount="100" track_marker></a-marker>

      <!-- Calibration Card Marker: Bottom Left -->
      <a-marker id="marker2" type="barcode" value="2" smooth="true" smoothCount="100" track_marker></a-marker>

      <!-- Calibration Card Marker: Bottom Right -->
      <a-marker id="marker3" type="barcode" value="3" smooth="true" smoothCount="100" track_marker></a-marker>

      <!-- Card -->
      <a-image id="cardOverlay" src="#card-outline" width="1" height="1" geometry="height: 0.5; width: 0.3148" position="0 0 -1" material="blending: normal; transparent: true; alphaTest:0;" visible="false"></a-image>

      <!-- Users Camera -->
      <a-entity id="userCamera" camera="active: true" camera_status></a-entity>
    </a-scene>

    <div id="snapshotWrapper">
      <button id="closeSnapshot">×</button>
      <canvas id="snapshot"></canvas>
      <div class="snapshot-overlay"></div>
    </div>
  </body>
</html>
